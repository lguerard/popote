services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: popote
      POSTGRES_USER: popote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popote}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popote"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  imagegen:
    build: ./imagegen
    restart: unless-stopped
    volumes:
      # Cache Hugging Face : evite de re-telecharger le modele a chaque
      # recreation du conteneur.
      - imagegen_models:/root/.cache/huggingface
    environment:
      IMAGE_GEN_MODEL: ${IMAGE_GEN_MODEL:-stabilityai/sdxl-turbo}
      IMAGE_GEN_DEVICE: ${IMAGE_GEN_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      imagegen:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://popote:${POSTGRES_PASSWORD:-popote}@db:5432/popote
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      IMAGEGEN_BASE_URL: http://imagegen:8001
      IMAGE_GEN_FREE_GPU: ${IMAGE_GEN_FREE_GPU:-true}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      # Signe les jetons de session : le backend refuse de demarrer si
      # elle est absente, trop courte ou laissee par defaut.
      #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est obligatoire}
      # Autorise les DEMANDES de compte, pas l'acces : chaque demande
      # attend la validation d'un administrateur (page Comptes). Seul le
      # tout premier compte est approuve d'office et devient admin.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
  ollama_data:
  media_data:
  imagegen_models:
