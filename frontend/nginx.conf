server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photos envoyées pour l'OCR peuvent dépasser le défaut de 1 Mo
    client_max_body_size 25m;

    # Proxy API to backend
    location /api/ {
        # backend est resolu UNE SEULE FOIS au demarrage de nginx si on le
        # passe en dur a proxy_pass, et jamais reresolu ensuite : chaque
        # fois que le conteneur backend est recree (redeploiement), il
        # recoit une IP interne differente, et nginx continue de taper
        # sur l'ancienne (connexion refusee) jusqu'a son propre reload.
        # Le resolver Docker (127.0.0.11) + une variable dans proxy_pass
        # forcent une resolution DNS a chaque requete (valid=10s) : plus
        # jamais de retard sur l'IP courante de backend.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Restauration d'une sauvegarde : un .zip avec toutes les images peut
    # peser des centaines de Mo (limite 25 Mo ailleurs). Transmis au fil de
    # l'eau, sans tout garder en tampon dans nginx.
    location = /api/backup/import {
        client_max_body_size 2g;
        proxy_request_buffering off;
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vignettes uploadees/generees, servies par le backend (StaticFiles),
    # meme raisonnement de resolution dynamique que /api/ ci-dessus.
    location /media/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
